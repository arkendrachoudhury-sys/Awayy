name: Build Awayy APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npx cap add android && npx cap sync android
      - name: Build APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Name APK and make QR
        run: |
          mkdir out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/Awayy.apk
          pip install qrcode[pil]
          python -c "import qrcode;qrcode.make('https://github.com/${{ github.repository }}/releases/latest/download/Awayy.apk').save('out/Awayy-QR.png')"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Awayy v${{ github.run_number }}
          make_latest: true
          files: |
            out/Awayy.apk
            out/Awayy-QR.png
