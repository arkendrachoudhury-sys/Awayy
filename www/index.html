<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Awayy</title>
<style>
:root{
  --bg1:#dfe9ff;--bg2:#ffe3f1;--bg3:#e1fff0;
  --glass:rgba(255,255,255,.55);--glass-b:rgba(255,255,255,.75);--shadow:0 8px 32px rgba(40,50,90,.12);
  --t1:#1d1d1f;--t2:rgba(60,60,67,.65);--t3:rgba(60,60,67,.3);--fill:rgba(120,120,128,.14);
  --blue:#0a84ff;--green:#30d158;--orange:#ff9f0a;--red:#ff453a;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg1:#0b1230;--bg2:#2a0f2e;--bg3:#07251f;
  --glass:rgba(40,40,48,.5);--glass-b:rgba(255,255,255,.14);--shadow:0 8px 32px rgba(0,0,0,.4);
  --t1:#f5f5f7;--t2:rgba(235,235,245,.62);--t3:rgba(235,235,245,.3);--fill:rgba(120,120,128,.32);}}
:root[data-theme="dark"]{
  --bg1:#0b1230;--bg2:#2a0f2e;--bg3:#07251f;
  --glass:rgba(40,40,48,.5);--glass-b:rgba(255,255,255,.14);--shadow:0 8px 32px rgba(0,0,0,.4);
  --t1:#f5f5f7;--t2:rgba(235,235,245,.62);--t3:rgba(235,235,245,.3);--fill:rgba(120,120,128,.32);}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}@media (prefers-reduced-motion:reduce){*{transition:none!important}}.w,.card{contain:layout paint}
body{margin:0;min-height:100vh;color:var(--t1);background:var(--bg1);
  font:400 17px/1.29 -apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Inter,"Segoe UI",Roboto,sans-serif;
  letter-spacing:-.022em;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;touch-action:manipulation;overscroll-behavior:none}
body::before{content:"";position:fixed;inset:0;z-index:-1;
  background:radial-gradient(60% 40% at 15% 5%,#7aa7ff66,transparent 70%),linear-gradient(160deg,var(--bg1),var(--bg2) 55%,var(--bg3))}
.wrap{max-width:960px;margin:0 auto;padding:24px 16px 48px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px}
h1{font:700 34px/1.12 inherit;font-family:inherit;letter-spacing:.01em;margin:0}
.sub{color:var(--t2);font-size:15px;margin-top:4px}
.glass{background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid var(--glass-b);border-radius:24px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.seg{display:inline-flex;align-items:center;padding:2px;border-radius:999px;background:var(--fill)}
.seg button,.btn{font:inherit;letter-spacing:inherit;border:0;color:var(--t1);background:none;cursor:pointer}
.seg button{padding:6px 14px;border-radius:999px;font-size:15px;font-weight:500}
.seg .yr{font-weight:600;min-width:64px;text-align:center}
.btn{padding:10px 18px;border-radius:999px;background:var(--blue);color:#fff;font-weight:600;font-size:15px;transition:transform .1s}
.btn:active{transform:scale(.96)}
.btn.sec{background:var(--fill);color:var(--t1)}
.btn.sm{padding:6px 12px;font-size:13px}
.bar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:0 0 16px;flex-wrap:wrap}
h2{font:600 22px/1.2 inherit;font-family:inherit;margin:0;letter-spacing:.005em}
#grid{display:grid;gap:16px;grid-auto-rows:136px;margin-bottom:40px}
.w{position:relative;container-type:size;padding:16px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.w .lbl{font-size:13px;font-weight:600;color:var(--t2);flex:none}
.w .body{flex:1;min-height:0;display:flex;align-items:center;gap:16px;justify-content:center}
.big{font-weight:700;font-size:clamp(30px,34cqmin,140px);line-height:1;letter-spacing:-.04em}
.cap{color:var(--t2);font-size:clamp(12px,7cqmin,17px)}
.ring{width:min(64cqmin,200px);aspect-ratio:1;position:relative;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .mid{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .mid b{font-size:clamp(20px,17cqmin,64px);letter-spacing:-.03em;line-height:1}
.side{display:none}
@container (min-aspect-ratio:3/2){.side{display:block}}
.w .x,.w .grip{display:none}
.edit .w .x{display:grid;position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:50%;place-items:center;background:var(--fill);border:0;color:var(--t1);cursor:pointer;font-size:14px;line-height:1;z-index:2}
.edit .w .grip{display:block;position:absolute;right:6px;bottom:6px;width:28px;height:28px;cursor:nwse-resize;touch-action:none;z-index:2}
.edit .w .grip::after{content:"";position:absolute;right:6px;bottom:6px;width:12px;height:12px;border-right:3px solid var(--t2);border-bottom:3px solid var(--t2);border-radius:0 0 6px 0}
.edit .w{outline:2px dashed var(--t3);outline-offset:-2px}
.list{width:100%;align-self:stretch;overflow:hidden;display:flex;flex-direction:column;gap:8px;justify-content:flex-start;padding-top:8px}
.list div{display:flex;justify-content:space-between;gap:8px;font-size:15px;padding:8px 12px;background:var(--fill);border-radius:12px}
.list span:last-child{color:var(--t2);white-space:nowrap}
.months{width:100%;height:100%;display:flex;align-items:flex-end;gap:clamp(2px,2cqw,10px);padding-top:8px}
.months div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;font-size:11px;color:var(--t2)}
.months i{display:block;width:100%;background:linear-gradient(var(--blue),#5e5ce6);border-radius:6px;min-height:4px}
.cal{width:100%;height:100%;display:grid;grid-template-columns:repeat(7,1fr);gap:2px;font-size:clamp(9px,5.5cqmin,15px);text-align:center;align-content:center}
.cal span{display:grid;place-items:center;border-radius:50%;aspect-ratio:1;max-height:100%}
.cal .h{color:var(--t2);font-weight:600}.cal .on{background:var(--blue);color:#fff;font-weight:600}.cal .td{box-shadow:inset 0 0 0 2px var(--orange)}
.card{padding:24px}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;align-items:end}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--t2);font-weight:500}
input[type=date],input[type=text]{font:inherit;font-size:17px;letter-spacing:inherit;color:var(--t1);background:var(--fill);border:0;border-radius:12px;padding:10px 12px;min-height:44px;width:100%;outline:none}
input:focus{box-shadow:0 0 0 3px #0a84ff66}
.chk{flex-direction:row;align-items:center;gap:8px;font-size:15px;color:var(--t1);min-height:44px}
.chk input{width:20px;height:20px;accent-color:var(--blue)}
.hint{font-size:13px;color:var(--t2);margin:12px 0 0}
.rows{display:flex;flex-direction:column;margin-top:8px}
.row{display:flex;align-items:center;gap:16px;padding:16px 0;border-top:1px solid var(--fill)}
.row:first-child{border-top:0}
.row .m{flex:1;min-width:0}.row .m b{font-weight:600;display:block}.row .m span{font-size:15px;color:var(--t2);overflow-wrap:anywhere}
.pill{font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--fill);white-space:nowrap}
.empty{color:var(--t2);text-align:center;padding:32px 0}
.menu{position:absolute;right:0;top:44px;z-index:10;padding:8px;min-width:200px;display:none}
.menu.open{display:block}.menu button{display:block;width:100%;text-align:left;font:inherit;font-size:15px;letter-spacing:inherit;color:var(--t1);background:none;border:0;padding:10px 12px;border-radius:12px;cursor:pointer}
.menu button:hover{background:var(--fill)}
@media (max-width:640px){h1{font-size:30px}.card{padding:16px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>Awayy</h1><div class="sub" id="sub"></div></div>
    <div class="seg glass" style="border-radius:999px;box-shadow:none">
      <button id="py" aria-label="Previous year">‹</button><span class="yr" id="yr"></span><button id="ny" aria-label="Next year">›</button>
    </div>
  </header>

  <div class="bar" style="position:relative">
    <h2>Widgets</h2>
    <div style="display:flex;gap:8px">
      <button class="btn sec sm" id="add">Add</button>
      <button class="btn sm" id="edit">Edit</button>
      <div class="menu glass" id="menu"></div>
    </div>
  </div>
  <div id="grid"></div>

  <div class="card glass" style="margin-bottom:24px">
    <h2 style="margin-bottom:16px">Take leave</h2>
    <form id="f">
      <label>From<input type="date" id="s" required></label>
      <label>To<input type="date" id="e" required></label>
      <label>Note<input type="text" id="n" placeholder="Optional"></label>
      <label class="chk"><input type="checkbox" id="h"> Half day</label>
      <label class="chk"><input type="checkbox" id="we"> Count weekends</label>
      <button class="btn" type="submit">Add leave</button>
    </form>
    <p class="hint" id="hint"></p>
  </div>

  <div class="card glass">
    <h2>History</h2>
    <div class="rows" id="rows"></div>
  </div>
</div>

<script>
const QUOTA=30, KEY="leave-tracker-v1";
const $=s=>document.querySelector(s);
const MN=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const TYPES={ring:"Progress ring",count:"Days left",upcoming:"Upcoming leaves",months:"Month by month",cal:"Month calendar"};
let st={leaves:[],widgets:[
  {id:"a",type:"ring",cs:2,rs:2},{id:"b",type:"count",cs:1,rs:1},{id:"c",type:"upcoming",cs:1,rs:2},{id:"d",type:"months",cs:2,rs:1}]};
try{const r=localStorage.getItem(KEY);if(r)st=JSON.parse(r)}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}};
const now=new Date();let year=now.getFullYear(),editing=false;

const P=s=>{const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c)};
const F=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const fmt=d=>`${d.getDate()} ${MN[d.getMonth()]}`;
function dayList(l,y){ // dates (within year y) that count
  const out=[];for(let d=P(l.start),e=P(l.end);d<=e;d.setDate(d.getDate()+1)){
    if(d.getFullYear()!==y)continue;const w=d.getDay();if(!l.we&&(w===0||w===6))continue;out.push(new Date(d))}
  return out}
const val=(l,y)=>{const n=dayList(l,y).length;return l.half&&l.start===l.end?n*.5:n};
const inYear=y=>st.leaves.filter(l=>P(l.start).getFullYear()<=y&&P(l.end).getFullYear()>=y).sort((a,b)=>a.start<b.start?-1:1);
const num=n=>Number.isInteger(n)?n:n.toFixed(1);
function stats(){
  const ls=inYear(year);const used=ls.reduce((a,l)=>a+val(l,year),0);
  const today=F(now);let taken=0;
  ls.forEach(l=>{const v=val(l,year);if(l.end<today)taken+=v;else if(l.start<=today){const d=dayList(l,year).filter(x=>F(x)<=today).length;taken+=l.half?v:d}});
  return{ls,used,taken,left:QUOTA-used,ahead:used-taken}}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function body(w,S){
  if(w.type==="ring"){const p=Math.min(1,Math.max(0,S.used/QUOTA)),C=2*Math.PI*44,col=S.left<0?"var(--red)":S.left<=5?"var(--orange)":"var(--green)";
    return`<div class="body"><div class="ring"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="none" stroke="var(--fill)" stroke-width="9"/><circle cx="50" cy="50" r="44" fill="none" stroke="${col}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${C*p} ${C}"/></svg><div class="mid"><div><b>${num(S.left)}</b><div class="cap">left</div></div></div></div>
    <div class="side"><div class="big" style="font-size:clamp(28px,26cqmin,80px)">${num(S.used)}<span class="cap"> / ${QUOTA}</span></div><div class="cap">days used in ${year}</div></div></div>`}
  if(w.type==="count")return`<div class="body" style="flex-direction:column;gap:4px"><div class="big">${num(S.left)}</div><div class="cap">days pending</div></div>`;
  if(w.type==="upcoming"){const t=F(now),u=S.ls.filter(l=>l.end>=t).slice(0,8);
    return`<div class="body"><div class="list">${u.length?u.map(l=>`<div><span>${fmt(P(l.start))}${l.end!==l.start?" – "+fmt(P(l.end)):""}</span><span>${num(val(l,year))}d</span></div>`).join(""):`<span class="cap">Nothing planned</span>`}</div></div>`}
  if(w.type==="months"){const m=Array(12).fill(0);S.ls.forEach(l=>{const v=val(l,year),ds=dayList(l,year);ds.forEach(d=>m[d.getMonth()]+=v/ds.length)});const mx=Math.max(3,...m);
    return`<div class="body"><div class="months">${m.map((v,i)=>`<div><i style="height:${Math.max(4,v/mx*78)}%"></i>${MN[i][0]}</div>`).join("")}</div></div>`}
  if(w.type==="cal"){const mo=year===now.getFullYear()?now.getMonth():0,set=new Set();S.ls.forEach(l=>dayList(l,year).forEach(d=>set.add(F(d))));
    const first=new Date(year,mo,1),n=new Date(year,mo+1,0).getDate();let h="DTWTFSS".replace("DTWTFSS","SMTWTFS").split("").map(c=>`<span class="h">${c}</span>`).join("");
    h+=Array(first.getDay()).fill("<span></span>").join("");
    for(let d=1;d<=n;d++){const k=F(new Date(year,mo,d));h+=`<span class="${set.has(k)?"on":""} ${k===F(now)?"td":""}">${d}</span>`}
    return`<div class="body"><div class="cal">${h}</div></div>`}
  return""}

function render(){
  const S=stats(),cols=innerWidth<640?2:4;
  $("#yr").textContent=year;
  $("#sub").textContent=`${num(S.left)} of ${QUOTA} days pending · renews 1 Jan ${year+1}`;
  const g=$("#grid");g.style.gridTemplateColumns=`repeat(${cols},1fr)`;g.classList.toggle("edit",editing);
  g.innerHTML=st.widgets.map(w=>`<div class="glass w" data-id="${w.id}" style="grid-column:span ${Math.min(w.cs,cols)};grid-row:span ${w.rs}"><div class="lbl">${TYPES[w.type]}</div>${body(w,S)}<button class="x" aria-label="Remove">×</button><div class="grip"></div></div>`).join("");
  $("#edit").textContent=editing?"Done":"Edit";
  const rows=$("#rows");
  rows.innerHTML=S.ls.length?S.ls.slice().reverse().map(l=>{
    const url=`https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent("Leave"+(l.note?": "+l.note:""))}&dates=${l.start.replace(/-/g,"")}/${F(new Date(P(l.end).getTime()+864e5)).replace(/-/g,"")}&details=${encodeURIComponent("Logged in Leaves")}`;
    return`<div class="row"><div class="m"><b>${fmt(P(l.start))}${l.end!==l.start?" – "+fmt(P(l.end)):""}${l.half?" · half day":""}</b><span>${esc(l.note||"Leave")}</span></div><span class="pill">${num(val(l,year))} d</span><a class="btn sec sm" style="text-decoration:none" target="_blank" rel="noopener" href="${url}">Google Calendar</a><button class="btn sec sm" data-del="${l.id}">Delete</button></div>`}).join(""):`<div class="empty">No leaves logged for ${year}</div>`;
  $("#hint").textContent=`Weekends are skipped unless you tick “Count weekends”. Leaves crossing a year boundary count toward each year separately.`;
}

$("#py").onclick=()=>{year--;render()};$("#ny").onclick=()=>{year++;render()};
$("#edit").onclick=()=>{editing=!editing;render()};
const menu=$("#menu");
menu.innerHTML=Object.entries(TYPES).map(([k,v])=>`<button data-t="${k}">${v}</button>`).join("");
$("#add").onclick=e=>{e.stopPropagation();menu.classList.toggle("open")};
document.addEventListener("click",()=>menu.classList.remove("open"));
menu.onclick=e=>{const t=e.target.dataset.t;if(!t)return;
  st.widgets.push({id:Math.random().toString(36).slice(2,8),type:t,cs:t==="upcoming"?1:2,rs:t==="upcoming"?2:1});editing=true;save();render()};
$("#grid").addEventListener("click",e=>{if(e.target.classList.contains("x")){const id=e.target.closest(".w").dataset.id;st.widgets=st.widgets.filter(w=>w.id!==id);save();render()}});
$("#grid").addEventListener("pointerdown",e=>{ // free resize: any column × row span
  if(!e.target.classList.contains("grip"))return;e.preventDefault();
  const el=e.target.closest(".w"),w=st.widgets.find(x=>x.id===el.dataset.id),g=$("#grid"),cols=innerWidth<640?2:4;
  const cw=(g.clientWidth+16)/cols,rh=136+16,x0=e.clientX,y0=e.clientY,c0=Math.min(w.cs,cols),r0=w.rs;
  const mv=ev=>{const c=Math.max(1,Math.min(cols,c0+Math.round((ev.clientX-x0)/cw))),r=Math.max(1,Math.min(6,r0+Math.round((ev.clientY-y0)/rh)));
    if(c!==w.cs||r!==w.rs){w.cs=c;w.rs=r;el.style.gridColumn=`span ${c}`;el.style.gridRow=`span ${r}`}};
  const up=()=>{removeEventListener("pointermove",mv);removeEventListener("pointerup",up);save();render()};
  addEventListener("pointermove",mv);addEventListener("pointerup",up)});
$("#rows").addEventListener("click",e=>{const id=e.target.dataset.del;if(id){st.leaves=st.leaves.filter(l=>l.id!==id);save();render()}});
$("#s").onchange=()=>{if(!$("#e").value||$("#e").value<$("#s").value)$("#e").value=$("#s").value};
$("#f").onsubmit=e=>{e.preventDefault();const s=$("#s").value,en=$("#e").value;
  if(!s||!en||en<s){$("#hint").textContent="End date must be on or after the start date.";return}
  st.leaves.push({id:Math.random().toString(36).slice(2,9),start:s,end:en,note:$("#n").value.trim(),half:$("#h").checked,we:$("#we").checked});
  year=P(s).getFullYear();save();e.target.reset();render()};
addEventListener("resize",()=>render());
render();
</script>
</body>
</html>
